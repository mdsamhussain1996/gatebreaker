<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Golden Key -->
  <!-- Key Bow (Head) -->
  <circle cx="24" cy="24" r="12" fill="url(#gold)"/>
  <circle cx="24" cy="24" r="6" fill="#0f172a"/>
  <!-- Key Stem -->
  <rect x="22" y="32" width="5" height="22" rx="2" fill="url(#gold)"/>
  <!-- Key Bits -->
  <rect x="27" y="44" width="8" height="4" rx="1" fill="url(#gold)"/>
  <rect x="27" y="50" width="6" height="4" rx="1" fill="url(#gold)"/>
  <!-- Sparkle -->
  <circle cx="44" cy="18" r="2" fill="#fff"/>
</svg>
